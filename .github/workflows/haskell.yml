name: Haskell CI

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }} / ${{ matrix.snapshot }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Test the full modern GHC window (9.4 -> 9.10) on Linux, and smoke-test the
        # latest snapshot on macOS and Windows. GHC is installed by the setup action
        # (fast and tool-cached) and reused by stack via --system-ghc, so the slow
        # `stack setup` GHC download is skipped and the stack cache stays small (deps
        # only, no toolchain) which keeps it well under the repo cache limit.
        include:
          - { os: ubuntu-latest,  snapshot: lts-21.25, ghc: 9.4.8 }
          - { os: ubuntu-latest,  snapshot: lts-22.44, ghc: 9.6.7 }
          - { os: ubuntu-latest,  snapshot: lts-23.28, ghc: 9.8.4 }
          - { os: ubuntu-latest,  snapshot: lts-24.52, ghc: 9.10.3 }
          - { os: macos-latest,   snapshot: lts-24.52, ghc: 9.10.3 }
          - { os: windows-latest, snapshot: lts-24.52, ghc: 9.10.3 }
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync package version from Git
        shell: bash
        run: scripts/sync-version.sh

      - name: Set up Haskell (GHC + stack)
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          enable-stack: true
          stack-version: latest

      - name: Cache stack root
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.stack-root }}
          key: ${{ runner.os }}-${{ matrix.snapshot }}-stack-${{ hashFiles('hodatime.cabal', 'stack.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.snapshot }}-stack-

      - name: test project
        run: stack test --resolver ${{ matrix.snapshot }} --system-ghc --no-install-ghc --no-terminal

  candidate:
    name: hackage candidate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set candidate version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          base_version=$(scripts/sync-version.sh)
          candidate_version="$base_version.$PR_NUMBER.$RUN_NUMBER.$RUN_ATTEMPT"
          scripts/sync-version.sh --set "$candidate_version"
          echo "version=$candidate_version" >> "$GITHUB_OUTPUT"

      - name: Set up Haskell (cabal)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: latest

      - name: Build Hackage candidate
        env:
          CANDIDATE_VERSION: ${{ steps.version.outputs.version }}
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
        run: |
          cabal update
          cabal check
          cabal sdist
          cabal haddock --haddock-for-hackage
          source_archive="dist-newstyle/sdist/hodatime-$CANDIDATE_VERSION.tar.gz"
          docs_archive="dist-newstyle/hodatime-$CANDIDATE_VERSION-docs.tar.gz"
          test -f "$source_archive"
          test -f "$docs_archive"
          cabal upload --token "$HACKAGE_TOKEN" "$source_archive"
          cabal upload --token "$HACKAGE_TOKEN" --documentation "$docs_archive"

      - name: Add candidate link to summary
        env:
          CANDIDATE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          candidate_url="https://hackage.haskell.org/package/hodatime-$CANDIDATE_VERSION/candidate"
          echo "## Hackage candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "[Package candidate]($candidate_url) | [Rendered documentation]($candidate_url/docs/doc-index.html)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish hackage
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync package version from Git
        run: scripts/sync-version.sh

      - name: Set up Haskell (cabal)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: latest

      - name: publish to hackage
        run: |
          cabal update
          export CABALCMD=$([ "$GITHUB_REF_TYPE" == 'tag' ] && echo "cabal upload --publish" || echo "cabal upload")
          cabal sdist | tail -1 | xargs $CABALCMD --token "$HACKAGE_TOKEN"
          cabal haddock --haddock-for-hackage
          docs_archive=$(find dist-newstyle -type f -name 'hodatime-*-docs.tar.gz' -print -quit)
          test -n "$docs_archive"
          $CABALCMD --token "$HACKAGE_TOKEN" -d "$docs_archive"
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
