name: Haskell CI

on:
  push:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }} / ${{ matrix.snapshot }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Test the full modern GHC window (9.4 -> 9.10) on Linux, and smoke-test the
        # latest snapshot on macOS and Windows. Snapshot -> GHC:
        #   lts-21.25 -> 9.4.8, lts-22.44 -> 9.6.7, lts-23.28 -> 9.8.4, lts-24.52 -> 9.10.3
        os: [ubuntu-latest]
        snapshot: [lts-21.25, lts-22.44, lts-23.28, lts-24.52]
        include:
          - os: macos-latest
            snapshot: lts-24.52
          - os: windows-latest
            snapshot: lts-24.52
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Haskell (stack)
        id: setup
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Cache stack root
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.stack-root }}
          key: ${{ runner.os }}-${{ matrix.snapshot }}-stack-${{ hashFiles('hodatime.cabal', 'stack.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.snapshot }}-stack-

      - name: test project
        run: stack test --resolver ${{ matrix.snapshot }} --no-terminal

  publish:
    name: publish hackage
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Haskell (cabal)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: latest

      - name: get version
        run: |
          VERSION=$(grep "^version:" hodatime.cabal | awk -F':' '{ print $2 }' | xargs echo -n )
          echo "hodatime_version=$VERSION" >> "$GITHUB_ENV"

      - name: publish to hackage
        run: |
          cabal update
          export CABALCMD=$([ "${{ env.GITHUB_REF_TYPE }}" == 'tag' ] && echo "cabal upload --publish" || echo "cabal upload")
          cabal sdist | tail -1 | xargs $CABALCMD -u "${{ vars.HACKAGE_USER }}" -p "$HACKAGE_PASSWORD" "$@"
          cabal haddock --haddock-for-hackage | tail -1 | xargs cabal upload -u "${{ vars.HACKAGE_USER }}" -p "$HACKAGE_PASSWORD" -d "$@"
        env:
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
